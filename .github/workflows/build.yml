# Builds a debug APK on every push, signed with the shared debug key (DEBUG_KEYSTORE_B64), so each build installs
# over the one on the phone. On main it also replaces the "latest" release, whose APK is a direct download:
#   https://github.com/<owner>/<repo>/releases/download/latest/<app.apk>.apk
# The APK name and the expected signer come from gradle.properties.
name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # versionCode = git rev-list --count HEAD needs the full history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: App settings
        run: |
          prop() { sed -n "s/^$1=//p" gradle.properties | tr -d '\r'; }
          echo "APK_NAME=$(prop app.apk)" >> "$GITHUB_ENV"
          echo "SIGNER=$(prop app.signer)" >> "$GITHUB_ENV"

      # The debug keystore (alias androiddebugkey, passwords android), base64, in the DEBUG_KEYSTORE_B64 secret.
      # app/build.gradle signs with the file APP_DEBUG_KEYSTORE names.
      - name: Debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The DEBUG_KEYSTORE_B64 secret is missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          # spaces or line breaks from pasting it on a phone are dropped
          echo "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "APP_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Core tests
        run: bash core-tests/run.sh

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME.apk"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # A different signer means the phone would refuse the update, so stop here rather than publish it.
      - name: Check signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs "$APK_NAME.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "signer $actual"
          if [ "$actual" != "$SIGNER" ]; then
            echo "::error::APK signed by $actual, expected $SIGNER (app.signer in gradle.properties)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-${{ env.VERSION_CODE }}-${{ github.ref_name }}
          path: ${{ env.APK_NAME }}.apk

      - name: Release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$APK_NAME.apk" --target "$GITHUB_SHA" --prerelease \
            --title "$APK_NAME build ${VERSION_CODE}" \
            --notes "versionCode ${VERSION_CODE}, commit ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
